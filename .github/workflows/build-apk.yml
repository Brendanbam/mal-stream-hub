name: Build Anikoto MAL Hub APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/anikoto/malhub

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AnikotoMalHub"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.anikoto.malhub'
              compileSdk 34

              defaultConfig {
                  applicationId "com.anikoto.malhub"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="Anikoto MAL Hub"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/anikoto/malhub/MainActivity.kt
          package com.anikoto.malhub

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONObject
          import java.io.ByteArrayInputStream
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.security.SecureRandom
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private lateinit var prefs: android.content.SharedPreferences
              private lateinit var webView: WebView
              private lateinit var malListContainer: LinearLayout
              private lateinit var streamViewContainer: LinearLayout
              private lateinit var malTabContainer: LinearLayout
              private lateinit var fullscreenContainer: FrameLayout
              private lateinit var statusLabel: TextView
              private lateinit var lockBtn: Button

              private var customView: View? = null
              private var customViewCallback: WebChromeClient.CustomViewCallback? = null
              private var domainLockEnabled = false
              private var activeAnimeId: Int = -1
              private var activeAnimeTitle: String = "None selected"
              private var activeAnimeEp: Int = 0

              private val defaultPortal = "https://anikoto.site/"

              private val adHosts = listOf(
                  "doubleclick.net", "googlesyndication.com", "popads.net", "propellerads.com",
                  "adsterra.com", "exoclick.com", "juicyads.com", "onclickalgo.com",
                  "acscdn.com", "histats.com", "zedo.com", "adnxs.com", "clickadu.com"
              )

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("anikoto_mal_prefs", Context.MODE_PRIVATE)

                  val root = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#0F111A"))
                  }

                  val mainColumn = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(24, 18, 24, 18)
                      setBackgroundColor(Color.parseColor("#181B28"))
                  }

                  statusLabel = TextView(this).apply {
                      text = "Active: None selected"
                      setTextColor(Color.parseColor("#E2E8F0"))
                      textSize = 13f
                      typeface = Typeface.DEFAULT_BOLD
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val plusOneBtn = makeButton("+1 Ep", "#2563EB") {
                      incrementActiveAnimeEpisode()
                  }

                  lockBtn = makeButton("Lock: OFF", "#334155") {
                      toggleDomainLock()
                  }

                  val homeBtn = makeButton("Anikoto", "#475569") {
                      domainLockEnabled = false
                      updateLockButtonUI()
                      val portal = prefs.getString("portal_url", defaultPortal) ?: defaultPortal
                      webView.loadUrl(portal)
                  }

                  topBar.addView(statusLabel)
                  topBar.addView(homeBtn)
                  topBar.addView(lockBtn)
                  topBar.addView(plusOneBtn)

                  streamViewContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                      )
                  }

                  webView = WebView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.setSupportMultipleWindows(true)
                      settings.userAgentString =
                          "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"
                  }
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)
                  setupWebViewClients()
                  streamViewContainer.addView(webView)

                  malTabContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setPadding(28, 28, 28, 28)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                      )
                  }

                  val malControls = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 0, 0, 20)
                  }
                  val loginMalBtn = makeButton("Connect MAL OAuth", "#2E51A2") {
                      startMalOAuth()
                  }
                  val refreshMalBtn = makeButton("Sync Watching List", "#059669") {
                      fetchMalWatchingList()
                  }
                  val settingsBtn = makeButton("Settings", "#475569") {
                      showSettingsDialog()
                  }
                  malControls.addView(loginMalBtn)
                  malControls.addView(refreshMalBtn)
                  malControls.addView(settingsBtn)

                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }
                  malListContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  scroll.addView(malListContainer)
                  malTabContainer.addView(malControls)
                  malTabContainer.addView(scroll)

                  val bottomNav = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#181B28"))
                      setPadding(16, 12, 16, 12)
                  }

                  val tabStreamBtn = makeButton("Anikoto Browser", "#1E293B") {
                      streamViewContainer.visibility = View.VISIBLE
                      malTabContainer.visibility = View.GONE
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {
                          setMargins(8, 0, 8, 0)
                      }
                  }

                  val tabMalBtn = makeButton("MyAnimeList Tracker", "#1E293B") {
                      streamViewContainer.visibility = View.GONE
                      malTabContainer.visibility = View.VISIBLE
                      fetchMalWatchingList()
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {
                          setMargins(8, 0, 8, 0)
                      }
                  }

                  bottomNav.addView(tabStreamBtn)
                  bottomNav.addView(tabMalBtn)

                  mainColumn.addView(topBar)
                  mainColumn.addView(streamViewContainer)
                  mainColumn.addView(malTabContainer)
                  mainColumn.addView(bottomNav)

                  fullscreenContainer = FrameLayout(this).apply {
                      visibility = View.GONE
                      setBackgroundColor(Color.BLACK)
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }

                  root.addView(mainColumn)
                  root.addView(fullscreenContainer)
                  setContentView(root)

                  val startUrl = prefs.getString("active_domain", null)
                      ?: prefs.getString("portal_url", defaultPortal)
                      ?: defaultPortal
                  webView.loadUrl(startUrl)
              }

              private fun setupWebViewClients() {
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(
                          view: WebView?,
                          request: WebResourceRequest?
                      ): WebResourceResponse? {
                          val host = request?.url?.host?.lowercase() ?: return null
                          if (adHosts.any { host.contains(it) }) {
                              return WebResourceResponse("text/plain", "utf-8", ByteArrayInputStream(ByteArray(0)))
                          }
                          return super.shouldInterceptRequest(view, request)
                      }

                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          request: WebResourceRequest?
                      ): Boolean {
                          val uri = request?.url ?: return true
                          val scheme = uri.scheme?.lowercase() ?: ""

                          if (scheme == "animehub" && uri.host == "auth") {
                              val code = uri.getQueryParameter("code")
                              if (!code.isNullOrEmpty()) {
                                  exchangeMalCodeForToken(code)
                              }
                              return true
                          }

                          if (scheme != "http" && scheme != "https") {
                              return true
                          }

                          if (domainLockEnabled) {
                              val lockedHost = Uri.parse(prefs.getString("active_domain", "") ?: "").host ?: ""
                              val targetHost = uri.host ?: ""
                              if (lockedHost.isNotEmpty() && !targetHost.endsWith(lockedHost)) {
                                  return true
                              }
                          }
                          return false
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onCreateWindow(
                          view: WebView?,
                          isDialog: Boolean,
                          isUserGesture: Boolean,
                          resultMsg: android.os.Message?
                      ): Boolean {
                          return false
                      }

                      override fun onShowCustomView(view: View?, callback: CustomViewCallback?) {
                          if (customView != null) {
                              callback?.onCustomViewHidden()
                              return
                          }
                          customView = view
                          customViewCallback = callback
                          fullscreenContainer.addView(
                              view,
                              FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          )
                          fullscreenContainer.visibility = View.VISIBLE
                          window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      }

                      override fun onHideCustomView() {
                          if (customView == null) return
                          fullscreenContainer.removeView(customView)
                          fullscreenContainer.visibility = View.GONE
                          customView = null
                          customViewCallback?.onCustomViewHidden()
                          window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      }
                  }
              }

              private fun toggleDomainLock() {
                  val currentUrl = webView.url ?: return
                  val uri = Uri.parse(currentUrl)
                  val baseDomain = "${uri.scheme}://${uri.host}"
                  domainLockEnabled = !domainLockEnabled
                  if (domainLockEnabled) {
                      prefs.edit().putString("active_domain", baseDomain).apply()
                      Toast.makeText(this, "Locked Domain: $baseDomain", Toast.LENGTH_SHORT).show()
                  }
                  updateLockButtonUI()
              }

              private fun updateLockButtonUI() {
                  lockBtn.text = if (domainLockEnabled) "Locked" else "Lock: OFF"
                  val bg = GradientDrawable().apply {
                      cornerRadius = 16f
                      setColor(Color.parseColor(if (domainLockEnabled) "#059669" else "#334155"))
                  }
                  lockBtn.background = bg
              }

              private fun showSettingsDialog() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 24, 40, 16)
                  }

                  val portalInput = EditText(this).apply {
                      hint = "Portal URL"
                      setText(prefs.getString("portal_url", defaultPortal))
                  }
                  val searchPatternInput = EditText(this).apply {
                      hint = "Search Path (e.g. /search?keyword=)"
                      setText(prefs.getString("search_path", "/search?keyword="))
                  }
                  val malClientIdInput = EditText(this).apply {
                      hint = "MAL Client ID"
                      setText(prefs.getString("mal_client_id", ""))
                  }

                  layout.addView(portalInput)
                  layout.addView(searchPatternInput)
                  layout.addView(malClientIdInput)

                  AlertDialog.Builder(this)
                      .setTitle("Settings")
                      .setView(layout)
                      .setPositiveButton("Save") { _, _ ->
                          prefs.edit()
                              .putStri
